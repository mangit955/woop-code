# Runs the checks that already exist locally, on every push and pull request.
#
# Nothing here is new policy: `bun test`, `tsc --noEmit` and `docs:check` are the
# same gates a contributor runs by hand. CI's job is to make them unskippable.
#
# These checks report but do not block until `test (ubuntu-latest)`,
# `test (macos-latest)` and `static` are set as required status checks in the
# repository's branch protection rules for main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned rather than "latest" so a green run stays reproducible and a Bun
  # release cannot turn main red on its own. Bump it deliberately.
  BUN_VERSION: "1.3.13"

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One OS failing should not hide the result on the other.
      fail-fast: false
      matrix:
        # The approval classifier and the config loader are built on path
        # semantics, and macOS differs from Linux on case sensitivity and on
        # where a temporary directory lives. Both are cheap to run.
        #
        # windows-latest is deliberately absent, and its absence is the honest
        # signal rather than an oversight: `runCommand` spawns `sh -c`, which
        # Windows does not have, so `run_terminal` and `run_tests` cannot run
        # there at all. The classifier compounds it — it knows `rm -rf`, `sudo`
        # and `chmod`, not `del /f /s /q` or `reg delete`, so every Windows
        # command falls through to the fail-closed default and asks. Adding the
        # runner would produce a permanently red job that documents nothing the
        # docs do not now say outright. The platform is a port, not a matrix
        # entry, and the docs claim macOS and Linux only.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Fails when bun.lock disagrees with package.json, rather than quietly
      # resolving a tree no one has tested.
      - run: bun install --frozen-lockfile

      # Bounded by the step rather than by a `timeout` command: that is GNU
      # coreutils and the macOS runner does not ship it. A run that stops making
      # progress should fail in minutes, not be cancelled after ten with no
      # output at all.
      - name: Run tests
        timeout-minutes: 5
        run: bun test

      # A hung suite names no file: the runner cancels the job and the log ends
      # mid-run, which cost three rounds of guessing to learn once. Running each
      # file on its own, with its own bound, turns that into the one line worth
      # having. Only on failure, so it costs nothing when the suite is healthy.
      - name: Locate the failing or hanging file
        if: failure()
        timeout-minutes: 8
        run: |
          # perl's alarm is the portable bound: present on both runners, unlike
          # `timeout`. It reports a killed command as 142 (SIGALRM).
          status=0
          files=$(find . -path ./node_modules -prune -o \
            \( -name '*.test.ts' -o -name '*.test.tsx' \) -print | sort)
          for file in $files; do
            if perl -e 'alarm shift; exec @ARGV' 60 bun test "$file" >/tmp/file.log 2>&1; then
              echo "ok       $file"
            else
              code=$?
              if [ $code -eq 142 ]; then echo "HUNG     $file"; else echo "FAILED   $file"; fi
              tail -30 /tmp/file.log
              status=1
            fi
          done
          exit $status

  static:
    name: static
    # Neither check depends on the operating system.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Separate steps, so a type error and a docs drift do not read as the same
      # failure in the log.
      - name: Type check
        run: bunx --no-install tsc --noEmit

      - name: Check generated docs are current
        run: bun run docs:check
