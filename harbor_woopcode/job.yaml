# Harbor job configuration for benchmarking WoopCode.
#
# Implements harbor.models.job.config:JobConfig. Use with:
#
#     PYTHONPATH=. harbor run -c harbor_woopcode/job.yaml
#
# A config file is preferred over long command lines for real benchmark runs:
# it is checked in alongside the code, so a published number can be traced back
# to the exact agent, model, and dataset that produced it.

job_name: woopcode-terminal-bench-2

# Trials are independent; raise this to whatever the host and the provider's
# rate limits will tolerate.
n_concurrent_trials: 4

agents:
  # Registered by import path rather than by a built-in name -- WoopCode is not
  # part of Harbor's AgentName enum, and custom agents are resolved through
  # importlib. This requires the repository root on PYTHONPATH.
  - name: harbor_woopcode:WoopCode
    model_name: google/gemini-3.5-flash-lite
    kwargs:
      # Install from this checkout instead of npm. Drop this key to benchmark
      # the published package, and set `version` to pin it.
      source_dir: .
      # version: 0.6.1
      #
      # With the wall clock bounding spend, this reverts to the role loop.ts
      # claims for it -- a guard against a pathological loop with nobody
      # watching -- so it is set high enough to stop binding first. 1000 clears
      # the ~885 that make-mips-interpreter's full 1800s affords at its measured
      # 2.03s per iteration, which is the widest any task in this set can open;
      # under the job-wide 750s below the clock binds a good deal sooner than
      # that, and it is meant to.
      max_iterations: 1000
      # Harbor's per-task agent timeout, forwarded verbatim as
      # WOOPCODE_MAX_WALL_SEC; the loop subtracts its own reserve. Harbor does
      # not hand this to the agent -- AgentContext has no such field and Trial
      # holds timeout_sec -- so the operator supplies it, as Harbor's own Cline
      # agent does under this same name.
      #
      # One kwarg covers every task in the job, and these five span 750s
      # (overfull-hbox) to 12000s (build-pov-ray). The minimum is the only
      # value under which no task can be hard-killed mid-work; it does cap the
      # longer four well below what they are allowed -- build-pov-ray gets 690s
      # of usable wall out of 12000. A five-task run under this config is
      # therefore NOT comparable to jobs/tb2-post-1.1, which had no wall budget
      # at all. To give one task its own budget, run it with -i and
      # --ak agent_timeout_sec=<its task.toml value>.
      agent_timeout_sec: 750

datasets:
  - name: terminal-bench/terminal-bench-2
    # Pin the dataset digest so the score is reproducible; `harbor run` records
    # the resolved ref in the job's config.json if you omit it.
    # ref: sha256:...
    #
    # Remove n_tasks to run the full benchmark.
    n_tasks: 5
